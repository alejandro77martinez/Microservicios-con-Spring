server:
  port: 8060
  forward-headers-strategy: framework

spring:
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: 
                  - "http://192.168.100.249:4200"
                  - "https://taskmanager-bf193.web.app"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/**
              filters:
                - name: JwtAuthFilter

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
