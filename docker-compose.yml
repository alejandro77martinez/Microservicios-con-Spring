services:
  service-registry:
    build:
      context: ./service-registry
    container_name: service-registry-spring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - SERVICE_REGISTRY_HOST=${SERVICE_REGISTRY_HOST}
    networks:
      - app-network
      
  config-server:
    build:
      context: ./config-server
    container_name: config-server-spring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - SERVICE_REGISTRY_HOST=${SERVICE_REGISTRY_HOST}
    depends_on:
      service-registry:
        condition: service_healthy
    networks:
      - app-network

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service-spring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/api/v1/user/all"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - SERVICE_REGISTRY_HOST=${SERVICE_REGISTRY_HOST}
      - CONFIG_SERVER_HOST=${CONFIG_SERVER_HOST}
      - JWT_SECRET=${JWT_SECRET}
      - MONGO_DB_URI=${MONGO_DB_URI}
      - APP_COOKIE_SECURE=${APP_COOKIE_SECURE}
      - APP_COOKIE_SAME_SITE=${APP_COOKIE_SAME_SITE}
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - app-network

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway-spring
    ports:
      - "8080:8060"
    environment:
      - SERVICE_REGISTRY_HOST=${SERVICE_REGISTRY_HOST}
      - CONFIG_SERVER_HOST=${CONFIG_SERVER_HOST}
    depends_on:
      config-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
 