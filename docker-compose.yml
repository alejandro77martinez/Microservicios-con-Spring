services:
  service-registry:
    image: alejandroomartinez/service-registry:latest
    container_name: service-registry-spring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/api/v1/registry"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - SERVICE_REGISTRY_HOST=${SERVICE_REGISTRY_HOST}
    networks:
      - app-network
      
  config-server:
    image: alejandroomartinez/config-server:latest
    container_name: config-server-spring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - SERVICE_REGISTRY_HOST=${SERVICE_REGISTRY_HOST}
    depends_on:
      service-registry:
        condition: service_healthy
    networks:
      - app-network

  auth-service:
    image: alejandroomartinez/auth-service:latest
    container_name: auth-service-spring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/api/v1/user/all"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      - SERVICE_REGISTRY_HOST=${SERVICE_REGISTRY_HOST}
      - CONFIG_SERVER_HOST=${CONFIG_SERVER_HOST}
      - JWT_SECRET=${JWT_SECRET}
      - MONGO_DB_URI=${MONGO_DB_URI_AUTH}
      - APP_COOKIE_SECURE=${APP_COOKIE_SECURE}
      - APP_COOKIE_SAME_SITE=${APP_COOKIE_SAME_SITE}
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - app-network

  project-service:
    image: alejandroomartinez/project-service:latest
    container_name: project-service-spring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/api/v1/project"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      - SERVICE_REGISTRY_HOST=${SERVICE_REGISTRY_HOST}
      - CONFIG_SERVER_HOST=${CONFIG_SERVER_HOST}
      - MONGO_DB_URI=${MONGO_DB_URI_PROJECT}
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - app-network

  task-service:
    image: alejandroomartinez/task-service:latest
    container_name: task-service-spring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/api/v1/task"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      - SERVICE_REGISTRY_HOST=${SERVICE_REGISTRY_HOST}
      - CONFIG_SERVER_HOST=${CONFIG_SERVER_HOST}
      - MONGO_DB_URI=${MONGO_DB_URI_TASK}
    depends_on:
      project-service:
        condition: service_healthy
    networks:
      - app-network

  api-gateway:
    image: alejandroomartinez/api-gateway:latest
    container_name: api-gateway-spring
    ports:
      - "8090:8060"
    environment:
      - SERVICE_REGISTRY_HOST=${SERVICE_REGISTRY_HOST}
      - CONFIG_SERVER_HOST=${CONFIG_SERVER_HOST}
    depends_on:
      task-service:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
 