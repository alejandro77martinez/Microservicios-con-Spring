spring:
  application:
    name: service-registry

server:
  port: ${SERVICE_REGISTRY_PORT:8761}

eureka:
  instance:
    hostname: ${SERVICE_REGISTRY_HOST:localhost}
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/ 
